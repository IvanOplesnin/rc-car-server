server:
  host: "0.0.0.0"
  port: 8081
  # X-Forwarded-For принимается только от указанных reverse proxy.
  trusted_proxies:
    - "192.168.1.25"

web:
  static_dir: "web"

motor:
  address: "192.168.1.15:4210"

telemetry:
  listen_address: "0.0.0.0:4211"
  motor_timeout_ms: 1500

camera:
  stream_url: "http://192.168.1.16/stream"
  check_interval_ms: 3000
  check_timeout_ms: 1000

safety:
  command_timeout_ms: 500
access:
  control_timeout_ms: 30000
  operators:
    - name: "Ivan local"
      ips:
        - "127.0.0.1"
        - "::1"
        - "192.168.1.6"

    - name: "Ivan VPN phone"
      ips:
        - "10.10.0.2"

    - name: "Ivan VPN PC"
      ips:
        - "10.10.0.3"
